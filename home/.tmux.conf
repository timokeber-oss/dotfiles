set -g extended-keys on
set -g extended-keys-format csi-u

# Status bar: Solarized Light
# base3 #fdf6e3  base2 #eee8d5  base1 #93a1a1  base00 #657b83  base01 #586e75  blue #268bd2  yellow #b58900
set -g status-style "bg=#eee8d5,fg=#586e75"
set -g status-left-length 30
set -g status-left "#[bg=#268bd2,fg=#fdf6e3,bold] #S #[default] "
set -g status-right "#[fg=#93a1a1]%Y-%m-%d #[fg=#586e75,bold]%H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#fdf6e3,fg=#268bd2,bold] #I:#W "
set -g window-status-activity-style "fg=#b58900"
set -g pane-border-style "fg=#eee8d5"
set -g pane-active-border-style "fg=#268bd2"
set -g message-style "bg=#fdf6e3,fg=#268bd2"
set -g mode-style "bg=#268bd2,fg=#fdf6e3"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
